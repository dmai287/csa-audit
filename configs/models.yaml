# Models under audit (paper Section 4.2). Paths are local; weights are never committed.
e2e_varnet:
  checkpoint: checkpoints/varnet_brain_leaderboard_state_dict.pt
  note: "public fastMRI brain leaderboard weights; complex output must be exposed (docs/MODELS.md)"
unet_complex:
  checkpoint: checkpoints/unet_complex_brain.pt
  note: "two-channel U-Net trained on the standard fastMRI brain split; no lesion slice in training"
diffusion_langevin:
